name: Validate Agent Skills
on:
  push:
  pull_request:
jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check skill metadata and links
        run: python tests/validate_skills.py
